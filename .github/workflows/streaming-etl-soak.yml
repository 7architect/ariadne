  review:
    name: Final independent review and evidence
    needs: [prepare, segment-17]
    if: always() && needs.prepare.outputs.long == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Verify the existing persistent runner
        id: guard
        run: test "$RUNNER_NAME" = k8s-runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Clear this job's public export directory
        run: |
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'soak-public'
          shutil.rmtree(path, ignore_errors=True)
          path.mkdir(parents=True)
          PY
      - name: Review actual duration, chain, state, faults and resource limits
        id: reviewer
        env:
          CAMPAIGN: ${{ needs.prepare.outputs.run_id }}
        run: python3 "$SOAK_CLI" review --run-id "$CAMPAIGN"
      - name: Export credential-free evidence even on failure
        if: always() && steps.guard.outcome == 'success'
        env:
          CAMPAIGN: ${{ needs.prepare.outputs.run_id }}
        run: |
          python3 "$SOAK_CLI" export-public --run-id "$CAMPAIGN" --output "$RUNNER_TEMP/soak-public"
          if [ -f "$RUNNER_TEMP/soak-public/review.md" ]; then
            cat "$RUNNER_TEMP/soak-public/review.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve a bounded CI diagnostic
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          target = Path(os.environ['RUNNER_TEMP']) / 'soak-public'
          target.mkdir(parents=True, exist_ok=True)
          value = {key: os.environ.get(key) for key in ('GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'RUNNER_NAME', 'JOB_STATUS')}
          (target / 'ci-status.json').write_text(json.dumps(value, sort_keys=True, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: streaming-soak-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/soak-public/
          if-no-files-found: error
          retention-days: 90
      - name: Stop this campaign; retain failed databases for investigation
        if: always() && steps.guard.outcome == 'success'
        env:
          CAMPAIGN: ${{ needs.prepare.outputs.run_id }}
          REVIEW_PASSED: ${{ steps.reviewer.outcome == 'success' }}
        run: |
          if [ "$REVIEW_PASSED" = true ]; then
            python3 "$SOAK_CLI" stop --run-id "$CAMPAIGN" --cleanup
          else
            python3 "$SOAK_CLI" stop --run-id "$CAMPAIGN"
          fi
